spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/online_banking
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:mysecretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET:your-super-secret-key-that-is-at-least-32-characters-long}
  expiration: 3600000